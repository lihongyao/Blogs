<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1040" viewBox="0 0 2200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Base color tokens by hue</title>
  <desc id="desc">Three unequal color token scales for red, green, and blue, plus an ellipsis column indicating additional color families.</desc>

  <rect width="2200" height="1040" fill="#f3f6fa"/>


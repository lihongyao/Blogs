  <text x="1100" y="124" text-anchor="middle" fill="#637083" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16">One source of truth for each color value</text>

  <!-- Red -->
  <g transform="translate(55 0)">

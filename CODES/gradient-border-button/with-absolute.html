<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>渐变 + 透明</title>
    <style>
      /* ===========================
         全局基础样式
      ============================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        background: #13181e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
      }

      /* ===========================
         模块 1：渐变透明卡片列表
      ============================ */
      .list {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        border-radius: 8px;
        padding: 10px 16px;
        background: #1e2328; /* 默认背景 */
        border: 1px solid transparent;
        flex-shrink: 0;
        color: white;
      }
      /* hover 或选中状态：显示渐变+透明叠加效果 */
      .item.selected,
      .item:hover {
        border-color: rgba(156, 255, 51, 0.2);
        background: linear-gradient(180deg, rgba(156, 255, 51, 0.04), rgba(26, 255, 0, 0.2)) border-box;
      }

      /* ===========================
         模块 2：镂空渐变边框按钮
      ============================ */

      /* 容器包裹内容与边框 */
      .hollow-border-container {
        position: relative;
        background: linear-gradient(45deg, red, blue);
        border-radius: 8px;
        cursor: pointer;
        overflow: hidden; /* 防止外层渐变溢出 */
      }

      /* 实现镂空渐变边框的层 */
      .hollow-border {
        position: absolute;
        inset: 0;
        border-radius: inherit;

        /* 边框颜色渐变 */
        background: linear-gradient(90deg, rgba(255, 255, 0, 0.6), rgba(255, 0, 150, 0.6));
        /* mask 技术制造“镂空效果”，只显示边框部分 */
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: destination-out; /* Safari 专用合成模式 */
        mask-composite: exclude; /* 其他现代浏览器 */
        mask-mode: alpha;

        padding: 1px; /* 边框厚度 */
        pointer-events: none; /* 避免遮挡交互 */
      }
      /* 内容层，位于镂空边框之上 */
      .hollow-border-content {
        position: relative;
        z-index: 1;
        padding: 16px 50px;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- 模块 1：渐变透明卡片列表 -->
    <div class="list">
      <div class="item selected">
        <img width="22" height="22" src="./images/2.webp" alt="" />
        <span>Lobby</span>
      </div>
      <div class="item">
        <img width="22" height="22" src="./images/1.webp" alt="" />
        <span>Casual Games</span>
      </div>
      <div class="item">
        <img width="22" height="22" src="./images/3.webp" alt="" />
        <span>Original</span>
      </div>
      <div class="item">
        <img width="22" height="22" src="./images/4.webp" alt="" />
        <span>Slots</span>
      </div>
    </div>

    <!-- 模块 2：镂空渐变边框按钮 -->
    <div class="hollow-border-container">
      <div class="hollow-border-content">Register</div>
      <div class="hollow-border" />
    </div>
  </body>
</html>
